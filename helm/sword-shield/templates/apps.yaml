{{- /*
  Sword Shield 业务服务（gateway/user/activity/content/interaction/file/admin/web-ui）
  由 k8s/deployments.yaml 迁移而来，做了最小 Helm 模板化：
  - namespace 使用 .Release.Namespace / .Values.namespace
  - 镜像从 .Values.image.* 读取
  其他端口、环境变量保持与原始 YAML 一致
*/ -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ss-gateway
  namespace: {{ .Values.namespace | default .Release.Namespace }}
spec:
  replicas: {{ .Values.replicaCount.ssGateway }}
  selector:
    matchLabels:
      app: ss-gateway
  template:
    metadata:
      labels:
        app: ss-gateway
    spec:
      {{- if .Values.dependencies.enabled }}
      initContainers:
        - name: wait-dependencies
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -e
              echo "waiting for mysql at {{ .Values.dependencies.mysqlHost }}:{{ .Values.dependencies.mysqlPort }}..."
              mysql_ok=0
              for i in $(seq 1 150); do
                if nc -z {{ .Values.dependencies.mysqlHost }} {{ .Values.dependencies.mysqlPort }} 2>/dev/null; then
                  echo "mysql is available"
                  mysql_ok=1
                  break
                fi
                sleep 2
              done
              if [ "$mysql_ok" -ne 1 ]; then
                echo "mysql not ready in time"
                exit 1
              fi

              echo "waiting for nacos at {{ .Values.dependencies.nacosHost }}:{{ .Values.dependencies.nacosPort }}..."
              nacos_ok=0
              for i in $(seq 1 150); do
                if nc -z {{ .Values.dependencies.nacosHost }} {{ .Values.dependencies.nacosPort }} 2>/dev/null; then
                  echo "nacos is available"
                  nacos_ok=1
                  break
                fi
                sleep 2
              done
              if [ "$nacos_ok" -ne 1 ]; then
                echo "nacos not ready in time"
                exit 1
              fi
      {{- end }}
      containers:
        - name: ss-gateway
          image: {{ .Values.image.ssGateway }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
          env:
            - name: JAVA_OPTS
              value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=50.0 -Xms256m -Xmx256m"
            - name: SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR
              value: "nacos:8848"
            - name: SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR
              value: "nacos:8848"
            - name: SPRING_CLOUD_SENTINEL_TRANSPORT_DASHBOARD
              value: "sentinel-dashboard:8858"
            {{- if eq .Values.observability.tracing.mode "agent" }}
            - name: MANAGEMENT_TRACING_ENABLED
              value: "false"
            - name: JAVA_AGENT_OPTS
              value: "-javaagent:/app/opentelemetry-javaagent.jar"
            - name: OTEL_SERVICE_NAME
              value: "sword-shield-gateway"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4318"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_METRICS_EXPORTER
              value: "none"
            - name: OTEL_LOGS_EXPORTER
              value: "none"
            - name: OTEL_PROPAGATORS
              value: "tracecontext,baggage"
            {{- else }}
            - name: MANAGEMENT_TRACING_ENABLED
              value: "true"
            - name: MANAGEMENT_OTLP_TRACING_ENDPOINT
              value: "http://otel-collector:4318/v1/traces"
            {{- end }}
            - name: LOGSTASH_DESTINATION
              value: "logstash:5000"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ss-gateway
  namespace: {{ .Values.namespace | default .Release.Namespace }}
spec:
  type: NodePort
  selector:
    app: ss-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
---
