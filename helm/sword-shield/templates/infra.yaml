{{- /*
  基础设施组件（MySQL/Nacos/Redis/MinIO/Elasticsearch/Logstash/Kibana/Jaeger/OTel/Prometheus/Grafana/Sentinel）
  直接从 k8s/infra.yaml 拷贝并仅做 namespace 的模板化，保证行为与原来一致。
*/ -}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-config
  namespace: {{ .Values.namespace | default .Release.Namespace }}
data:
  logstash.yml: |
    http.host: "0.0.0.0"
    xpack.monitoring.elasticsearch.hosts: ["http://elasticsearch:9200"]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-pipeline
  namespace: {{ .Values.namespace | default .Release.Namespace }}
data:
  logstash.conf: |
    input {
      tcp {
        port => 5000
        codec => json_lines
      }
    }

    filter {
      # Parse timestamp
      date {
        match => ["timestamp", "ISO8601"]
        target => "@timestamp"
      }

      # Add service name tag
      if [service_name] {
        mutate {
          add_tag => ["%{service_name}"]
        }
      }

      # Parse exception stack trace
      if [stack_trace] {
        mutate {
          add_field => { "has_exception" => "true" }
        }
      }
    }

    output {
      elasticsearch {
        hosts => ["http://elasticsearch:9200"]
        index => "sword-shield-logs-%{+YYYY.MM.dd}"
      }

      stdout {
        codec => rubydebug
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: {{ .Values.namespace | default .Release.Namespace }}
data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
          http:

    extensions:
      health_check: {}

    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 25
      batch: {}

    exporters:
      otlp/jaeger:
        endpoint: jaeger:4317
        tls:
          insecure: true
      logging:
        loglevel: warn

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp/jaeger, logging]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: {{ .Values.namespace | default .Release.Namespace }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
      scrape_timeout: 8s

    scrape_configs:
      - job_name: sword-shield
        metrics_path: /actuator/prometheus
        static_configs:
          - targets:
              - ss-gateway:8080
              - ss-user:8101
              - ss-activity:8102
              - ss-content:8103
              - ss-interaction:8104
              - ss-file:8105
              - ss-admin:8106
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: {{ .Values.namespace | default .Release.Namespace }}
data:
  prometheus.yml: |
    apiVersion: 1

    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: {{ .Values.namespace | default .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "123456"
            - name: MYSQL_DATABASE
              value: "sword_shield"
            - name: TZ
              value: "Asia/Shanghai"
            - name: MYSQL_INITDB_SKIP_TZINFO
              value: "1"
          args:
            - --default-authentication-plugin=mysql_native_password
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
            - --explicit_defaults_for_timestamp=1
            - --skip-ssl
          ports:
            - containerPort: 13306
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          readinessProbe:
            tcpSocket:
              port: 13306
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 10
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: {{ .Values.namespace | default .Release.Namespace }}
spec:
  type: NodePort
  selector:
    app: mysql
  ports:
    - port: 13306
      targetPort: 13306
      nodePort: 30306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nacos
  namespace: {{ .Values.namespace | default .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nacos
  template:
    metadata:
      labels:
        app: nacos
    spec:
      containers:
        - name: nacos
          image: nacos/nacos-server:v2.3.2-slim
          env:
            - name: MODE
              value: "standalone"
            - name: JVM_XMS
              value: "512m"
            - name: JVM_XMX
              value: "512m"
            - name: JVM_XMN
              value: "128m"
            - name: NACOS_AUTH_ENABLE
              value: "false"
            - name: JAVA_OPT_EXT
              value: "-Djava.net.preferIPv4Stack=true"
          ports:
            - containerPort: 8848
            - containerPort: 9848
          volumeMounts:
            - name: data
              mountPath: /home/nacos/data
          readinessProbe:
            httpGet:
              path: /nacos/v1/console/health/readiness
              port: 8848
            # nacos 启动较慢，适当放宽探针配置，避免频繁重启
            initialDelaySeconds: 240
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 15
          startupProbe:
            httpGet:
              path: /nacos/v1/console/health/liveness
              port: 8848
            # 允许 nacos 最长 15 分钟完成启动
            failureThreshold: 90
            periodSeconds: 10
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nacos
  namespace: {{ .Values.namespace | default .Release.Namespace }}
spec:
  type: NodePort
  selector:
    app: nacos
  ports:
    - name: http
      port: 8848
      targetPort: 8848
      nodePort: 30848
    - name: client
      port: 9848
      targetPort: 9848
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: {{ .Values.namespace | default .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7.2.4
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 10
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: {{ .Values.namespace | default .Release.Namespace }}
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: {{ .Values.namespace | default .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              value: admin
            - name: MINIO_ROOT_PASSWORD
              value: admin123456
          ports:
            - containerPort: 9000
            - containerPort: 9001
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: {{ .Values.namespace | default .Release.Namespace }}
spec:
  type: NodePort
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
      nodePort: 30900
    - name: console
      port: 9001
      targetPort: 9001
      nodePort: 30901
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  namespace: {{ .Values.namespace | default .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
          env:
            - name: discovery.type
              value: single-node
            - name: ES_JAVA_OPTS
              value: "-Xms256m -Xmx256m"
            - name: xpack.security.enabled
              value: "false"
            - name: xpack.security.enrollment.enabled
              value: "false"
            - name: action.auto_create_index
              value: "true"
            - name: cluster.routing.allocation.disk.threshold_enabled
              value: "false"
          ports:
            - containerPort: 9200
            - containerPort: 9300
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
          readinessProbe:
            httpGet:
              path: /
              port: 9200
            # elasticsearch 启动和恢复索引较慢，放宽探针
            initialDelaySeconds: 180
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 15
          startupProbe:
            httpGet:
              path: /
              port: 9200
            # 允许 ES 最长 15 分钟完成启动
            failureThreshold: 90
            periodSeconds: 10
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: {{ .Values.namespace | default .Release.Namespace }}
spec:
  type: NodePort
  selector:
    app: elasticsearch
  ports:
    - name: http
      port: 9200
      targetPort: 9200
      nodePort: 30920
    - name: transport
      port: 9300
      targetPort: 9300
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logstash
  namespace: {{ .Values.namespace | default .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logstash
  template:
    metadata:
      labels:
        app: logstash
    spec:
      containers:
        - name: logstash
          image: docker.elastic.co/logstash/logstash:8.11.0
          env:
            - name: LS_JAVA_OPTS
              value: "-Xms256m -Xmx256m"
          ports:
            - containerPort: 5000
            - containerPort: 9600
          volumeMounts:
            - name: logstash-config
              mountPath: /usr/share/logstash/config/logstash.yml
              subPath: logstash.yml
            - name: logstash-pipeline
              mountPath: /usr/share/logstash/pipeline/logstash.conf
              subPath: logstash.conf
          readinessProbe:
            httpGet:
              path: /
              port: 9600
            # logstash 首次启动 pipeline 较慢，放宽探针
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 20
          startupProbe:
            httpGet:
              path: /
              port: 9600
            failureThreshold: 120
            periodSeconds: 10
      volumes:
        - name: logstash-config
          configMap:
            name: logstash-config
        - name: logstash-pipeline
          configMap:
            name: logstash-pipeline
---
apiVersion: v1
kind: Service
metadata:
  name: logstash
  namespace: {{ .Values.namespace | default .Release.Namespace }}
spec:
  selector:
    app: logstash
  ports:
    - name: tcp
      port: 5000
      targetPort: 5000
    - name: http
      port: 9600
      targetPort: 9600
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: {{ .Values.namespace | default .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kibana
  template:
    metadata:
      labels:
        app: kibana
    spec:
      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana:8.11.0
          env:
            - name: ELASTICSEARCH_HOSTS
              value: http://elasticsearch:9200
            - name: I18N_LOCALE
              value: zh-CN
          ports:
            - containerPort: 5601
          readinessProbe:
            httpGet:
              path: /api/status
              port: 5601
            # kibana 依赖 ES，插件较多，启动慢，放宽探针
            initialDelaySeconds: 240
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 20
          startupProbe:
            httpGet:
              path: /api/status
              port: 5601
            # 允许 kibana 最长 20 分钟完成启动
            failureThreshold: 120
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: kibana
  namespace: {{ .Values.namespace | default .Release.Namespace }}
spec:
  type: NodePort
  selector:
    app: kibana
  ports:
    - port: 5601
      targetPort: 5601
      nodePort: 30601
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: {{ .Values.namespace | default .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.57
          env:
            - name: COLLECTOR_ZIPKIN_HOST_PORT
              value: ":9411"
          ports:
            - containerPort: 16686
            - containerPort: 14250
            - containerPort: 14268
            - containerPort: 9411
          readinessProbe:
            httpGet:
              path: /
              port: 16686
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 10
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: {{ .Values.namespace | default .Release.Namespace }}
spec:
  type: NodePort
  selector:
    app: jaeger
  ports:
    - name: ui
      port: 16686
      targetPort: 16686
      nodePort: 31686
    - name: grpc
      port: 14250
      targetPort: 14250
    - name: http
      port: 14268
      targetPort: 14268
    - name: zipkin
      port: 9411
      targetPort: 9411
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: {{ .Values.namespace | default .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.96.0
          args: ["--config=/etc/otel-collector-config.yaml"]
          ports:
            - containerPort: 4317
            - containerPort: 4318
          volumeMounts:
            - name: config
              mountPath: /etc/otel-collector-config.yaml
              subPath: otel-collector-config.yaml
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 20
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: {{ .Values.namespace | default .Release.Namespace }}
spec:
  selector:
    app: otel-collector
  ports:
    - name: grpc
      port: 4317
      targetPort: 4317
    - name: http
      port: 4318
      targetPort: 4318
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: {{ .Values.namespace | default .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: data
              mountPath: /prometheus
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 10
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: {{ .Values.namespace | default .Release.Namespace }}
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: {{ .Values.namespace | default .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources/prometheus.yml
              subPath: prometheus.yml
            - name: data
              mountPath: /var/lib/grafana
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 20
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            failureThreshold: 120
            periodSeconds: 10
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: {{ .Values.namespace | default .Release.Namespace }}
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30030
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-dashboard
  namespace: {{ .Values.namespace | default .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sentinel-dashboard
  template:
    metadata:
      labels:
        app: sentinel-dashboard
    spec:
      containers:
        - name: sentinel-dashboard
          image: bladex/sentinel-dashboard:1.8.6
          env:
            - name: JAVA_OPTS
              value: "-Dserver.port=8858 -Dcsp.sentinel.dashboard.server=localhost:8858 -Dsentinel.dashboard.auth.username=sentinel -Dsentinel.dashboard.auth.password=sentinel"
          ports:
            - containerPort: 8858
          readinessProbe:
            httpGet:
              path: /
              port: 8858
            # sentinel-dashboard 为 Spring Boot 应用，启动较慢时容易被探针误杀，这里放宽探针参数
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 15
          startupProbe:
            httpGet:
              path: /
              port: 8858
            # 允许 sentinel-dashboard 最长约 15 分钟完成启动
            failureThreshold: 90
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: sentinel-dashboard
  namespace: {{ .Values.namespace | default .Release.Namespace }}
spec:
  type: NodePort
  selector:
    app: sentinel-dashboard
  ports:
    - port: 8858
      targetPort: 8858
      nodePort: 30858
---
apiVersion: batch/v1
kind: Job
metadata:
  name: sentinel-nacos-init
  namespace: {{ .Values.namespace | default .Release.Namespace }}
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: sentinel-nacos-init
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-nacos
          image: curlimages/curl:8.5.0
          command:
            - sh
            - -c
            - |
              for i in $(seq 1 300); do
                if curl -s -o /dev/null -w '%{http_code}' http://nacos:8848/nacos/v1/console/health/liveness 2>/dev/null | grep -q '200'; then
                  exit 0
                fi
                sleep 2
              done
              echo "nacos not ready" >&2
              exit 1
      containers:
        - name: publish-gateway-flow
          image: curlimages/curl:8.5.0
          command:
            - sh
            - -c
            - |
              echo "publishing sentinel flow rules to nacos..."
              curl -sf -X POST "http://nacos:8848/nacos/v1/cs/configs" \
                -d "dataId=sword-shield-gateway-sentinel-flow" \
                -d "group=SENTINEL_GROUP" \
                --data-urlencode "content@/data/gateway-flow.json" \
                -d "type=json"
              echo "done."
          volumeMounts:
            - name: gateway-flow
              mountPath: /data/gateway-flow.json
              subPath: gateway-flow.json
      volumes:
        - name: gateway-flow
          configMap:
            name: sentinel-gateway-flow
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sentinel-gateway-flow
  namespace: {{ .Values.namespace | default .Release.Namespace }}
data:
  gateway-flow.json: |
    [
      {
        "resource": "/api/user/**",
        "limitApp": "default",
        "grade": 1,
        "count": 50,
        "strategy": 0,
        "controlBehavior": 0
      },
      {
        "resource": "/api/activity/**",
        "limitApp": "default",
        "grade": 1,
        "count": 30,
        "strategy": 0,
        "controlBehavior": 0
      },
      {
        "resource": "/api/content/**",
        "limitApp": "default",
        "grade": 1,
        "count": 30,
        "strategy": 0,
        "controlBehavior": 0
      }
    ]
