server:
  port: 8105
spring:
  config:
    import: "classpath:common.yml,classpath:observability.yml,classpath:dubbo.yml"
  application:
    name: sword-shield-file
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
springdoc:
  api-docs:
    path: /api/file/v3/api-docs
minio:
  endpoint: http://localhost:9000
  accessKey: admin
  secretKey: admin123456
  bucket: assets
