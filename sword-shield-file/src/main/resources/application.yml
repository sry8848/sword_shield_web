server:
  port: 8105
spring:
  application:
    name: sword-shield-file
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: jdbc:mysql://172.25.255.76:3306/sword_shield?useSSL=false&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  cloud:
    nacos:
      discovery:
        enabled: false
        server-addr: 172.25.255.76:8848
      config:
        import-check:
          enabled: false
minio:
  endpoint: http://172.25.255.76:9000
  accessKey: admin
  secretKey: admin123456
  bucket: assets

