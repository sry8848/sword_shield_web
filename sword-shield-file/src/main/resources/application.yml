server:
  port: 8105
spring:
  application:
    name: sword-shield-file
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: jdbc:mysql://localhost:3306/sword_shield?useSSL=false&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: localhost:8848
      config:
        import-check:
          enabled: false
springdoc:
  api-docs:
    path: /api/file/v3/api-docs
minio:
  endpoint: http://localhost:9000
  accessKey: admin
  secretKey: admin123456
  bucket: assets

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
      protocol: http/protobuf

