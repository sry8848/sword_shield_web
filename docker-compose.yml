services:
  mysql:
    image: mysql:8.0
    container_name: ss_mysql
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: "sword_shield"
      TZ: "Asia/Shanghai"
      MYSQL_INITDB_SKIP_TZINFO: 1
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --explicit_defaults_for_timestamp=1
      - --skip-ssl
    ports:
      - "13306:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./db/sword_shield.sql:/docker-entrypoint-initdb.d/sword_shield.sql:ro
    restart: always

  nacos:
    image: nacos/nacos-server:v2.3.2-slim
    container_name: ss_nacos
    environment:
      MODE: standalone
    ports:
      - "8848:8848"
      - "9848:9848"
    volumes:
      - ./data/nacos:/home/nacos/data

  redis:
    image: redis:7.2.4
    container_name: ss_redis
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.4
    platform: linux/amd64
    container_name: ss_rocketmq_namesrv
    ports:
      - "9876:9876"
    command: sh mqnamesrv
    restart: always

  rocketmq-broker:
    image: apache/rocketmq:5.3.4
    platform: linux/amd64
    container_name: ss_rocketmq_broker
    user: root
    ports:
      - "8081:8082"
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
    depends_on:
      - rocketmq-namesrv
    volumes:
      - rocketmq_store:/home/rocketmq/store
      - ./scripts/rocketmq/broker.conf:/home/rocketmq/broker.conf.template:ro
      - ./scripts/rocketmq/start-broker.sh:/home/rocketmq/start-broker.sh:ro
    environment:
      ROCKETMQ_NAME_SERVER: rocketmq-namesrv:9876
      # Broker advertised address.
      # For local dev with this compose, the default 127.0.0.1 works (Dashboard shares broker network namespace).
      # If RocketMQ clients run in other containers / other machines, set this to a host-reachable IP.
      ROCKETMQ_BROKER_IP1: ${ROCKETMQ_BROKER_IP1:-127.0.0.1}
      # RocketMQ blocks send when disk usage exceeds this ratio (default 75). Local dev machines may need higher.
      ROCKETMQ_DISK_MAX_USED_SPACE_RATIO: ${ROCKETMQ_DISK_MAX_USED_SPACE_RATIO:-98}
      ROCKETMQ_DISK_SPACE_WARNING_LEVEL_RATIO: ${ROCKETMQ_DISK_SPACE_WARNING_LEVEL_RATIO:-98}
      ROCKETMQ_DISK_SPACE_CLEAN_FORCIBLY_RATIO: ${ROCKETMQ_DISK_SPACE_CLEAN_FORCIBLY_RATIO:-97}
    command: sh /home/rocketmq/start-broker.sh
    restart: always

  rocketmq-dashboard:
    image: apacherocketmq/rocketmq-dashboard:2.1.0
    platform: linux/amd64
    container_name: ss_rocketmq_dashboard
    # Dashboard needs to connect to broker by the address registered in NameServer.
    # When broker registers as 127.0.0.1 (common for local dev), a normal dashboard container would try to connect to itself.
    # Sharing network with broker makes 127.0.0.1 point to the broker container network namespace.
    network_mode: "service:rocketmq-broker"
    depends_on:
      - rocketmq-namesrv
      - rocketmq-broker
    environment:
      JAVA_OPTS: >-
        -Drocketmq.config.namesrvAddr=rocketmq-namesrv:9876
        -Drocketmq.config.isVIPChannel=false
    restart: always

  rocketmq-init:
    image: apache/rocketmq:5.3.4
    platform: linux/amd64
    container_name: ss_rocketmq_init
    depends_on:
      - rocketmq-namesrv
      - rocketmq-broker
    environment:
      ROCKETMQ_INIT_TOPIC: ${POSTER_MQ_TOPIC:-sword-shield-poster-jobs}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        topic="$$ROCKETMQ_INIT_TOPIC"
        echo "initializing rocketmq topic: $$topic"
        i=1
        while [ "$$i" -le 30 ]; do
          if /home/rocketmq/rocketmq-5.3.4/bin/mqadmin updateTopic -n rocketmq-namesrv:9876 -b rocketmq-broker:10911 -t "$$topic" -r 4 -w 4 >/dev/null 2>&1; then
            echo "topic ready: $$topic"
            exit 0
          fi
          i=$$((i + 1))
          sleep 2
        done
        echo "failed to init topic: $$topic"
        exit 1
    restart: "no"

  minio:
    image: minio/minio:latest
    container_name: ss_minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123456
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/minio:/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: ss_elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - action.auto_create_index=true
      - cluster.routing.allocation.disk.threshold_enabled=false
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - ./data/elasticsearch:/usr/share/elasticsearch/data
    restart: always

  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.0
    container_name: ss_logstash
    ports:
      - "15000:5000"
      - "9600:9600"
    volumes:
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml
      - ./logstash/pipeline:/usr/share/logstash/pipeline
    environment:
      - "LS_JAVA_OPTS=-Xms256m -Xmx256m"
    depends_on:
      - elasticsearch
    restart: always

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: ss_kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - I18N_LOCALE=zh-CN
    depends_on:
      - elasticsearch
    restart: always

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: ss_jaeger
    ports:
      - "16686:16686"
      - "14250:14250"
      - "14268:14268"
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
    restart: always

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    container_name: ss_otel_collector
    command: [--config=/etc/otel-collector-config.yaml]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - jaeger
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: ss_prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/prometheus:/prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: ss_grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: always

  sentinel-dashboard:
    image: bladex/sentinel-dashboard:1.8.6
    platform: linux/amd64
    container_name: ss_sentinel
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: "-Dserver.port=8858 -Dcsp.sentinel.dashboard.server=localhost:8858 -Dsentinel.dashboard.auth.username=sentinel -Dsentinel.dashboard.auth.password=sentinel"
    ports:
      - "8858:8858"
    depends_on:
      - nacos
    restart: unless-stopped

  sentinel-nacos-init:
    image: curlimages/curl:8.5.0
    container_name: ss_sentinel_nacos_init
    depends_on:
      - nacos
    entrypoint: /bin/sh
    command:
      - -c
      - |
        for i in $(seq 1 30); do
          if curl -s -o /dev/null -w '%{http_code}' http://nacos:8848/nacos/v1/console/health/liveness 2>/dev/null | grep -q '200'; then
            break
          fi
          sleep 2
        done
        echo 'publishing sentinel flow rules to nacos...'
        curl -sf -X POST "http://nacos:8848/nacos/v1/cs/configs" \
          -d "dataId=sword-shield-gateway-sentinel-flow" \
          -d "group=SENTINEL_GROUP" \
          --data-urlencode "content@/data/gateway-flow.json" \
          -d "type=json" || exit 1
        echo 'done.'
    volumes:
      - ./scripts/sentinel/gateway-flow.json:/data/gateway-flow.json:ro
    restart: "no"

volumes:
  rocketmq_store:
