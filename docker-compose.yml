services:
  mysql:
    image: mysql:8.0
    container_name: ss_mysql
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: "sword_shield"
      TZ: "Asia/Shanghai"
      MYSQL_INITDB_SKIP_TZINFO: 1
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --explicit_defaults_for_timestamp=1
      - --skip-ssl
    ports:
      - "3306:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./db/sword_shield.sql:/docker-entrypoint-initdb.d/sword_shield.sql:ro
    restart: always

  nacos:
    image: nacos/nacos-server:v2.3.2-slim
    container_name: ss_nacos
    environment:
      MODE: standalone
    ports:
      - "8848:8848"
      - "9848:9848"
    volumes:
      - ./data/nacos:/home/nacos/data

  redis:
    image: redis:7.2.4
    container_name: ss_redis
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data

  minio:
    image: minio/minio:latest
    container_name: ss_minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123456
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/minio:/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: ss_elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - action.auto_create_index=true
      - cluster.routing.allocation.disk.threshold_enabled=false
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - ./data/elasticsearch:/usr/share/elasticsearch/data
    restart: always

  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.0
    container_name: ss_logstash
    ports:
      - "15000:5000"
      - "9600:9600"
    volumes:
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml
      - ./logstash/pipeline:/usr/share/logstash/pipeline
    environment:
      - "LS_JAVA_OPTS=-Xms256m -Xmx256m"
    depends_on:
      - elasticsearch
    restart: always

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: ss_kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - I18N_LOCALE=zh-CN
    depends_on:
      - elasticsearch
    restart: always

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: ss_jaeger
    ports:
      - "16686:16686"
      - "14250:14250"
      - "14268:14268"
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
    restart: always

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    container_name: ss_otel_collector
    command: [--config=/etc/otel-collector-config.yaml]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - jaeger
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: ss_prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/prometheus:/prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: ss_grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: always

  sentinel-dashboard:
    image: bladex/sentinel-dashboard:1.8.6
    platform: linux/amd64
    container_name: ss_sentinel
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: "-Dserver.port=8858 -Dcsp.sentinel.dashboard.server=localhost:8858 -Dsentinel.dashboard.auth.username=sentinel -Dsentinel.dashboard.auth.password=sentinel"
    ports:
      - "8858:8858"
    depends_on:
      - nacos
    restart: unless-stopped

  sentinel-nacos-init:
    image: curlimages/curl:8.5.0
    container_name: ss_sentinel_nacos_init
    depends_on:
      - nacos
    entrypoint: /bin/sh
    command:
      - -c
      - |
        for i in $(seq 1 30); do
          if curl -s -o /dev/null -w '%{http_code}' http://nacos:8848/nacos/v1/console/health/liveness 2>/dev/null | grep -q '200'; then
            break
          fi
          sleep 2
        done
        echo 'publishing sentinel flow rules to nacos...'
        curl -sf -X POST "http://nacos:8848/nacos/v1/cs/configs" \
          -d "dataId=sword-shield-gateway-sentinel-flow" \
          -d "group=SENTINEL_GROUP" \
          --data-urlencode "content@/data/gateway-flow.json" \
          -d "type=json" || exit 1
        echo 'done.'
    volumes:
      - ./scripts/sentinel/gateway-flow.json:/data/gateway-flow.json:ro
    restart: "no"
