management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
        spring.cloud.gateway.requests: true
      percentiles:
        http.server.requests: 0.5,0.9,0.95,0.99
        http.client.requests: 0.5,0.9,0.95,0.99
        spring.cloud.gateway.requests: 0.5,0.9,0.95,0.99
  tracing:
    enabled: ${MANAGEMENT_TRACING_ENABLED:true}
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    propagation:
      type: w3c
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
      protocol: ${OTLP_TRACING_PROTOCOL:http/protobuf}

spring:
  reactor:
    # Enable automatic ThreadLocal <-> Reactor Context propagation.
    # Without this, reactive thread hops can break tracing context and cause gateway to start a new trace for outbound calls.
    context-propagation: auto
