server:
  port: 8080
  max-http-request-header-size: 10MB
jwt:
  secret: ${JWT_SECRET:swordshield-dev-secret-change-me}
gateway:
  security:
    permit-all:
      - /swagger-ui**
      - /webjars/swagger-ui/**
      - /v3/api-docs**
      - /api/user/login
      - /api/user/register
      - /api/admin/auth/login
      - /api/activity/list**
      - /api/activity/detail**
      - /api/activity/statistics**
      - /api/content/articles**
      - /api/content/article**
      - /api/content/exhibitors**
      - /api/content/exhibitor**
      - /api/content/achievements**
      - /api/content/achievement**
      - /api/content/material**
      - /api/content/media**
      - /api/content/poster**
      - /api/file/presigned**
      - /api/interaction/comments**
      - /api/interaction/likes/count**
      - /actuator/health**
      - /actuator/info**
      - /actuator/prometheus**
    admin-paths:
      - /api/admin/**
      - /api/*/admin/**
spring:
  application:
    name: sword-shield-gateway
  codec:
    max-in-memory-size: 50MB
  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: localhost:8848
      config:
        enabled: false
    sentinel:
      transport:
        dashboard: localhost:8858
      datasource:
        flow:
          nacos:
            server-addr: ${spring.cloud.nacos.discovery.server-addr}
            data-id: ${spring.application.name}-sentinel-flow
            group-id: SENTINEL_GROUP
            data-type: json
            rule-type: flow
    gateway:
      default-filters: []
      routes:
        - id: user
          uri: lb://sword-shield-user
          predicates:
            - Path=/api/user/**
        - id: activity
          uri: lb://sword-shield-activity
          predicates:
            - Path=/api/activity/**
        - id: content
          uri: lb://sword-shield-content
          predicates:
            - Path=/api/content/**
        - id: file
          uri: lb://sword-shield-file
          predicates:
            - Path=/api/file/**
        - id: interaction
          uri: lb://sword-shield-interaction
          predicates:
            - Path=/api/interaction/**
        - id: admin
          uri: lb://sword-shield-admin
          predicates:
            - Path=/api/admin/**
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: user
        url: /api/user/v3/api-docs
      - name: activity
        url: /api/activity/v3/api-docs
      - name: content
        url: /api/content/v3/api-docs
      - name: file
        url: /api/file/v3/api-docs
      - name: interaction
        url: /api/interaction/v3/api-docs
      - name: admin
        url: /api/admin/v3/api-docs
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
      protocol: http/protobuf
