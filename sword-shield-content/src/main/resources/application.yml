server:
  port: 8103
spring:
  application:
    name: sword-shield-content
  datasource:
    url: jdbc:mysql://localhost:3306/sword_shield?useSSL=false&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: localhost:8848
      config:
        import-check:
          enabled: false
springdoc:
  api-docs:
    path: /api/content/v3/api-docs
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

