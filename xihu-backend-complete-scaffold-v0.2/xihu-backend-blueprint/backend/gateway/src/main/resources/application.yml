server:
  port: 8080
spring:
  application:
    name: gateway
  reactor:
    # WebFlux 切换执行线程后仍需让日志关联当前请求的追踪上下文。
    context-propagation: auto
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            response-timeout: 5s
management:
  endpoints:
    web:
      exposure:
        include: health
  tracing:
    propagation:
      type: w3c
    export:
      otlp:
        enabled: false

---
spring:
  config:
    activate:
      on-profile: "dev | test"
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity-health
              uri: "${gateway.identity-uri:http://localhost:8081}"
              predicates:
                - Path=/api/internal/identity/health
                - Method=GET
              filters:
                - SetPath=/actuator/health

---
spring:
  config:
    activate:
      on-profile: "test | prod"
  main:
    banner-mode: "off"

logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        version: ${APP_VERSION:unknown}
    json:
      rename:
        traceId: trace.id
        spanId: span.id
