server:
  port: 8080
spring:
  application:
    name: gateway
  reactor:
    # WebFlux 切换执行线程后仍需让日志关联当前请求的追踪上下文。
    context-propagation: auto
management:
  endpoints:
    web:
      exposure:
        include: health
  tracing:
    propagation:
      type: w3c
    export:
      otlp:
        enabled: false

---
spring:
  config:
    activate:
      on-profile: "test | prod"
  main:
    banner-mode: "off"

logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        version: ${APP_VERSION:unknown}
    json:
      rename:
        traceId: trace.id
        spanId: span.id
