server:
  port: 8080
spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/auth/**,/api/v1/admin/me
            - id: activity
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/public/events,/api/v1/admin/events/**,/api/v1/admin/events
management:
  endpoints:
    web:
      exposure:
        include: health,info
