server:
  port: 8081
spring:
  application:
    name: identity-service
  datasource:
    hikari:
      data-source-properties:
        connectionTimeZone: "+00:00"
        forceConnectionTimeZoneToSession: true
  data:
    redis:
      connect-timeout: 2s
      timeout: 2s
  flyway:
    locations: classpath:db/migration
identity:
  portal:
    issuer: "${IDENTITY_PORTAL_ISSUER:http://localhost:8080}"
    private-key: "${IDENTITY_PORTAL_PRIVATE_KEY}"
    origin: "${IDENTITY_PORTAL_ORIGIN:http://localhost:5173}"
    trusted-gateway-ip: "${IDENTITY_PORTAL_TRUSTED_GATEWAY_IP:127.0.0.1}"
    login-phone-limit: 5
    login-ip-limit: 30
    login-window: 60s
management:
  endpoints:
    web:
      exposure:
        include: health
  tracing:
    propagation:
      type: w3c
    export:
      otlp:
        enabled: false

---
spring:
  config:
    activate:
      on-profile: "test | prod"
  main:
    banner-mode: "off"

logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        version: ${APP_VERSION:unknown}
    json:
      rename:
        traceId: trace.id
        spanId: span.id
