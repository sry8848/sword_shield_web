server:
  port: 8081
spring:
  application:
    name: identity-service
  datasource:
    hikari:
      data-source-properties:
        connectionTimeZone: "+00:00"
        forceConnectionTimeZoneToSession: true
  data:
    redis:
      connect-timeout: 2s
      timeout: 2s
  flyway:
    locations: classpath:db/migration
management:
  endpoints:
    web:
      exposure:
        include: health
  tracing:
    propagation:
      type: w3c
    export:
      otlp:
        enabled: false

---
spring:
  config:
    activate:
      on-profile: "test | prod"
  main:
    banner-mode: "off"

logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        version: ${APP_VERSION:unknown}
    json:
      rename:
        traceId: trace.id
        spanId: span.id
