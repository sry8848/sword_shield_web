spring:
  datasource:
    url: ${IDENTITY_PROD_DB_URL}
    username: ${IDENTITY_PROD_DB_USERNAME}
    password: ${IDENTITY_PROD_DB_PASSWORD}
identity:
  portal:
    issuer: "${IDENTITY_PORTAL_ISSUER}"
    origin: "${IDENTITY_PORTAL_ORIGIN}"
    trusted-gateway-ip: "${IDENTITY_PORTAL_TRUSTED_GATEWAY_IP}"
    secure-cookie: true
