input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # Parse timestamp
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
  }

  # Add service name tag
  if [service_name] {
    mutate {
      add_tag => ["%{service_name}"]
    }
  }

  # Parse exception stack trace
  if [stack_trace] {
    mutate {
      add_field => { "has_exception" => "true" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "sword-shield-logs-%{+YYYY.MM.dd}"
  }
  
  stdout {
    codec => rubydebug
  }
}
