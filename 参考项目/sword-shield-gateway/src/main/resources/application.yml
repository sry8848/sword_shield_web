server:
  port: 8080
  max-http-request-header-size: 10MB
spring:
  application:
    name: sword-shield-gateway
  codec:
    max-in-memory-size: 50MB
  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: localhost:8848
      config:
        enabled: false
    gateway:
      default-filters: []
      routes:
        - id: user
          uri: lb://sword-shield-user
          predicates:
            - Path=/api/user/**
        - id: activity
          uri: lb://sword-shield-activity
          predicates:
            - Path=/api/activity/**
        - id: content
          uri: lb://sword-shield-content
          predicates:
            - Path=/api/content/**
        - id: file
          uri: lb://sword-shield-file
          predicates:
            - Path=/api/file/**
        - id: interaction
          uri: lb://sword-shield-interaction
          predicates:
            - Path=/api/interaction/**
        - id: admin
          uri: lb://sword-shield-admin
          predicates:
            - Path=/api/admin/**
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
