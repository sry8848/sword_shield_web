apiVersion: apps/v1
kind: Deployment
metadata:
  name: ss-gateway
  namespace: sword-shield
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ss-gateway
  template:
    metadata:
      labels:
        app: ss-gateway
    spec:
      containers:
        - name: ss-gateway
          image: ss-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: JAVA_OPTS
              value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: ss-gateway
  namespace: sword-shield
spec:
  type: NodePort
  selector:
    app: ss-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
---
