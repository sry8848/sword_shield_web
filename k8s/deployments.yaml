apiVersion: apps/v1
kind: Deployment
metadata:
  name: ss-gateway
  namespace: sword-shield
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ss-gateway
  template:
    metadata:
      labels:
        app: ss-gateway
    spec:
      initContainers:
        - name: wait-dependencies
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -e
              echo "waiting for mysql at mysql:3306..."
              mysql_ok=0
              for i in $(seq 1 150); do
                if nc -z mysql 3306 2>/dev/null; then
                  echo "mysql is available"
                  mysql_ok=1
                  break
                fi
                sleep 2
              done
              if [ "$mysql_ok" -ne 1 ]; then
                echo "mysql not ready in time"
                exit 1
              fi

              echo "waiting for nacos at nacos:8848..."
              nacos_ok=0
              for i in $(seq 1 150); do
                if nc -z nacos 8848 2>/dev/null; then
                  echo "nacos is available"
                  nacos_ok=1
                  break
                fi
                sleep 2
              done
              if [ "$nacos_ok" -ne 1 ]; then
                echo "nacos not ready in time"
                exit 1
              fi
      containers:
        - name: ss-gateway
          image: ss-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: JAVA_OPTS
              value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=50.0 -Xms256m -Xmx256m"
            - name: SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR
              value: "nacos:8848"
            - name: SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR
              value: "nacos:8848"
            - name: SPRING_CLOUD_SENTINEL_TRANSPORT_DASHBOARD
              value: "sentinel-dashboard:8858"
            - name: MANAGEMENT_TRACING_ENABLED
              value: "true"
            - name: MANAGEMENT_OTLP_TRACING_ENDPOINT
              value: "http://otel-collector:4318/v1/traces"
            - name: LOGSTASH_DESTINATION
              value: "logstash:5000"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ss-gateway
  namespace: sword-shield
spec:
  type: NodePort
  selector:
    app: ss-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
---
