global:
  scrape_interval: 10s
  scrape_timeout: 8s

scrape_configs:
  - job_name: sword-shield
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8080 # gateway
          - host.docker.internal:8101 # user
          - host.docker.internal:8102 # activity
          - host.docker.internal:8103 # content
          - host.docker.internal:8104 # interaction
          - host.docker.internal:8105 # file
          - host.docker.internal:8106 # admin
