            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: 服务器内部错误
                status: 500
                detail: 服务器内部错误
                code: INTERNAL_ERROR
                traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                timestamp: '2026-11-06T14:00:00+08:00'
      parameters:
      - name: eventId
        in: path
        required: true
        description: 场次 ID
        schema:
          type: string
      security: []
  /public/speakers:
