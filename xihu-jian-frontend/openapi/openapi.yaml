components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 业务接口使用的访问令牌。
    RefreshTokenCookie:
      type: apiKey
      in: cookie
      name: refreshToken
      description: >-
        浏览器随刷新和退出请求发送的 Cookie。服务端设置 HttpOnly、Secure、Path=/api/v1/auth，省略 Domain，默认使用 SameSite=Lax。
        跨源认证请求启用凭证模式，服务端仅允许明确授权的来源并校验浏览器请求来源。
        如需跨站部署，须先确认浏览器兼容性和 CSRF 防护，再启用 SameSite=None。
  headers:
    RefreshTokenCookie:
      description: 建立登录会话时下发刷新令牌。示例使用同站部署的 SameSite=Lax。
      required: true
      schema:
        type: string
      example: refreshToken=opaque-refresh-token; Path=/api/v1/auth; Secure; HttpOnly; SameSite=Lax
  responses:
    AccessTokenUnauthorized:
      description: 访问令牌缺失、无效或已过期
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            UNAUTHENTICATED:
              value:
                type: about:blank
                title: 未认证
                status: 401
                detail: 访问令牌缺失或无效
                code: UNAUTHENTICATED
                traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                timestamp: '2026-11-06T14:00:00+08:00'
            ACCESS_TOKEN_EXPIRED:
              value:
                type: about:blank
                title: 未认证
                status: 401
                detail: 访问令牌已过期
                code: ACCESS_TOKEN_EXPIRED
                traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                timestamp: '2026-11-06T14:00:00+08:00'
    RefreshTokenUnauthorized:
      description: 刷新令牌缺失、无效或已过期
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            UNAUTHENTICATED:
              value:
                type: about:blank
                title: 未认证
                status: 401
                detail: 刷新令牌缺失或无效
                code: UNAUTHENTICATED
                traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                timestamp: '2026-11-06T14:00:00+08:00'
            REFRESH_TOKEN_EXPIRED:
