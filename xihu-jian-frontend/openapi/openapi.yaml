  schemas:
    ApiResponseBase:
      type: object
      required:
      - code
      - message
      - traceId
      - timestamp
      properties:
        code:
          type: string
          example: SUCCESS
        message:
          type: string
          example: 操作成功
        traceId:
          type: string
          description: 请求追踪标识
        timestamp:
          type: string
          format: date-time
    ProblemDetail:
      type: object
      description: RFC 9457 错误响应。使用实际的 4xx 或 5xx HTTP 状态。
      not:
        required:
        - details
      required:
      - type
      - title
      - status
      - detail
      - code
      - traceId
      - timestamp
      properties:
        type:
          type: string
          format: uri
          const: about:blank
        title:
          type: string
          description: 使用后端工程与编码规范中的简体中文标题，已登记状态使用对应的固定标题。
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: 必须与实际 HTTP 状态一致。
        detail:
          type: string
          description: 本次错误面向客户端的公开说明。原始异常和 cause 链保留在服务端。
        instance:
          type: string
          format: uri-reference
          description: 可选的错误实例 URI 引用。没有实际错误实例标识时省略，禁止使用请求路径代替。
        code:
          type: string
          description: 全局唯一、稳定的项目错误码。业务失败使用所属模块定义的业务码，未登记的框架 4xx 可使用 HTTP_ERROR。
        traceId:
          type: string
          description: 来自真实请求追踪上下文的追踪标识。
        timestamp:
          type: string
          format: date-time
          description: 服务端生成的 ISO 8601 时间，含时区。
        errors:
          type: array
          description: 可选的字段校验错误列表。
          items:
