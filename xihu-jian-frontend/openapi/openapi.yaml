openapi: 3.1.0
info:
  title: 西湖论剑·大会门户 MVP API
  version: 0.1.0-draft
  description: MVP 1.0 第一版接口契约草案。范围：大会门户、普通报名、现场核验、基础运营、基础 RBAC、报名与到场统计。本文件先用于 Apifox 导入和需求评审；所有标注为待确认的业务决策均不得视为已验收需求。
servers:
- url: http://localhost:8080/api/v1
  description: 本地开发环境占位地址，实际后端端口及网关前缀待确认
tags:
- name: 大会门户
  description: 游客可访问的大会基础信息、场次、嘉宾和会场信息
- name: 账号认证
  description: 参会用户注册、登录、令牌刷新和当前用户信息
- name: 普通报名
  description: 参会用户提交报名、查询本人报名和获取凭证
- name: 活动管理
  description: 运营人员创建、编辑、发布和下线场次
- name: 报名管理
  description: 运营人员查询场次报名记录
- name: 现场核验
  description: 现场工作人员扫码或手动输入凭证并登记到场
- name: 数据统计
  description: 报名人数、到场人数和基础场次统计
- name: 后台与权限
  description: 后台账号、内置角色、权限字典及角色分配
paths:
  /auth/register:
    post:
      summary: 用户注册
      operationId: registerUser
      tags:
      - 账号认证
      responses:
        '201':
          description: 注册成功并建立登录会话
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshTokenCookie'
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponseBase'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      $ref: '#/components/schemas/AuthSession'
              example:
                code: SUCCESS
                message: 操作成功
                data:
                  accessToken: eyJ...access
                  tokenType: Bearer
                  expiresIn: 7200
                  user:
                    id: user-001
                    account: '13800000000'
                    displayName: 李明
                    phone: 138****0000
                    email: null
                    avatarUrl: null
                traceId: trace-example-001
                timestamp: '2026-11-06T14:00:00+08:00'
        '400':
          description: 请求参数格式错误或缺少必要参数
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: 请求错误
                status: 400
                detail: 请求参数格式错误或缺少必要参数
                code: INVALID_ARGUMENT
                errors:
                - field: displayName
                  code: REQUIRED
                  detail: 缺少显示名称
                traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                timestamp: '2026-11-06T14:00:00+08:00'
        '403':
          $ref: '#/components/responses/AuthOriginForbidden'
        '409':
          description: 业务状态冲突，例如重复报名、活动已满或重复核验
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: 状态冲突
                status: 409
                detail: 业务状态冲突，例如重复报名、活动已满或重复核验
                code: BUSINESS_CONFLICT
                traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                timestamp: '2026-11-06T14:00:00+08:00'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: 参数格式正确，但不满足业务规则
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: 无法处理的内容
                status: 422
                detail: 参数格式正确，但不满足业务规则
                code: BUSINESS_RULE_VIOLATION
                traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                timestamp: '2026-11-06T14:00:00+08:00'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: 服务器内部错误
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: 服务器内部错误
                status: 500
                detail: 服务器内部错误
                code: INTERNAL_ERROR
                traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                timestamp: '2026-11-06T14:00:00+08:00'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              account: '13800000000'
              password: Password123
              displayName: 李明
      security: []
  /auth/login:
    post:
      summary: 用户登录
      operationId: loginUser
      tags:
      - 账号认证
      responses:
        '200':
          description: 登录成功
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshTokenCookie'
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponseBase'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      $ref: '#/components/schemas/AuthSession'
              example:
                code: SUCCESS
                message: 操作成功
                data:
                  accessToken: eyJ...access
                  tokenType: Bearer
                  expiresIn: 7200
                  user:
                    id: user-001
                    account: '13800000000'
                    displayName: 李明
                    phone: 138****0000
                    email: null
                    avatarUrl: null
                traceId: trace-example-001
                timestamp: '2026-11-06T14:00:00+08:00'
        '400':
          description: 请求参数格式错误或缺少必要参数
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: 请求错误
                status: 400
                detail: 请求参数格式错误或缺少必要参数
                code: INVALID_ARGUMENT
                traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                timestamp: '2026-11-06T14:00:00+08:00'
        '401':
          description: 登录凭证无效
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              examples:
                UNAUTHENTICATED:
                  value:
                    type: about:blank
                    title: 未认证
                    status: 401
                    detail: 账号或密码错误
                    code: UNAUTHENTICATED
                    traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                    timestamp: '2026-11-06T14:00:00+08:00'
        '403':
          $ref: '#/components/responses/AuthOriginForbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: 参数格式正确，但不满足业务规则
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: 无法处理的内容
                status: 422
                detail: 参数格式正确，但不满足业务规则
                code: BUSINESS_RULE_VIOLATION
                traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                timestamp: '2026-11-06T14:00:00+08:00'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: 服务器内部错误
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: 服务器内部错误
                status: 500
                detail: 服务器内部错误
                code: INTERNAL_ERROR
                traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                timestamp: '2026-11-06T14:00:00+08:00'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              account: '13800000000'
              password: Password123
      security: []
  /auth/refresh:
    post:
      summary: 刷新访问令牌
      operationId: refreshAccessToken
      tags:
      - 账号认证
      responses:
        '200':
          description: 令牌刷新成功
          headers:
            Set-Cookie:
              description: 若签发了新的刷新令牌，通过此头更新 Cookie。
              schema:
                type: string
              example: refreshToken=opaque-refresh-token; Path=/api/v1/auth; Secure; HttpOnly; SameSite=Lax
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponseBase'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/RefreshTokenUnauthorized'
        '403':
          $ref: '#/components/responses/AuthOriginForbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: 服务器内部错误
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: 服务器内部错误
                status: 500
                detail: 服务器内部错误
                code: INTERNAL_ERROR
                traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                timestamp: '2026-11-06T14:00:00+08:00'
      security:
      - RefreshTokenCookie: []
  /auth/logout:
    post:
      summary: 退出登录
      operationId: logoutUser
      tags:
      - 账号认证
      responses:
        '200':
          description: 当前刷新令牌已失效
          headers:
            Set-Cookie:
              description: 使用原 Cookie 的名称及路径清除刷新令牌。
              required: true
              schema:
                type: string
              example: refreshToken=; Path=/api/v1/auth; Max-Age=0; Secure; HttpOnly; SameSite=Lax
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponseBase'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      $ref: '#/components/schemas/LogoutData'
              example:
                code: SUCCESS
                message: 操作成功
                data:
                  loggedOut: true
                traceId: trace-example-001
                timestamp: '2026-11-06T14:00:00+08:00'
        '401':
          $ref: '#/components/responses/RefreshTokenUnauthorized'
        '403':
          $ref: '#/components/responses/AuthOriginForbidden'
        '500':
          description: 服务器内部错误
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: 服务器内部错误
                status: 500
                detail: 服务器内部错误
                code: INTERNAL_ERROR
                traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                timestamp: '2026-11-06T14:00:00+08:00'
      security:
      - RefreshTokenCookie: []
  /auth/me:
    get:
      summary: 获取当前用户信息
      operationId: getCurrentUser
      tags:
      - 账号认证
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponseBase'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/AccessTokenUnauthorized'
        '500':
          description: 服务器内部错误
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: 服务器内部错误
                status: 500
                detail: 服务器内部错误
                code: INTERNAL_ERROR
                traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                timestamp: '2026-11-06T14:00:00+08:00'
      security:
      - BearerAuth: []
  /public/home:
    get:
      summary: 获取门户首页数据
      operationId: getPortalHome
      tags:
      - 大会门户
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponseBase'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      $ref: '#/components/schemas/HomeData'
        '500':
          description: 服务器内部错误
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: 服务器内部错误
                status: 500
                detail: 服务器内部错误
                code: INTERNAL_ERROR
                traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                timestamp: '2026-11-06T14:00:00+08:00'
      description: 首页聚合接口。首期仅返回大会基础信息和精选场次；通知模块暂不纳入本接口。
      security: []
  /public/conference:
    get:
      summary: 获取大会基础信息
      operationId: getConferenceInfo
      tags:
      - 大会门户
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponseBase'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      $ref: '#/components/schemas/ConferenceInfo'
        '404':
          description: 目标资源不存在
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: 未找到
                status: 404
                detail: 目标资源不存在
                code: RESOURCE_NOT_FOUND
                traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                timestamp: '2026-11-06T14:00:00+08:00'
        '500':
          description: 服务器内部错误
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: 服务器内部错误
                status: 500
                detail: 服务器内部错误
                code: INTERNAL_ERROR
                traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                timestamp: '2026-11-06T14:00:00+08:00'
      security: []
  /public/events:
    get:
      summary: 分页查询已发布场次
      operationId: listPublicEvents
      tags:
      - 大会门户
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponseBase'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      $ref: '#/components/schemas/EventPageData'
        '400':
          description: 请求参数格式错误或缺少必要参数
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: 请求错误
                status: 400
                detail: 请求参数格式错误或缺少必要参数
                code: INVALID_ARGUMENT
                traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                timestamp: '2026-11-06T14:00:00+08:00'
        '500':
          description: 服务器内部错误
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: 服务器内部错误
                status: 500
                detail: 服务器内部错误
                code: INTERNAL_ERROR
                traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                timestamp: '2026-11-06T14:00:00+08:00'
      description: 仅返回前台可见的已发布场次。默认按开始时间升序。
      parameters:
      - name: page
        in: query
        required: false
        description: 页码，从 1 开始
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        required: false
        description: 每页数量
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
      - name: keyword
        in: query
        required: false
        description: 按场次名称搜索
        schema:
          type: string
      - name: date
        in: query
        required: false
        description: 按活动日期筛选，使用大会当地日期
        schema:
          type: string
          format: date
      - name: venueId
        in: query
        required: false
        description: 按会场筛选
        schema:
          type: string
      security: []
  /public/events/{eventId}:
    get:
      summary: 获取场次详情
      operationId: getPublicEvent
      tags:
      - 大会门户
      responses:
        '200':
