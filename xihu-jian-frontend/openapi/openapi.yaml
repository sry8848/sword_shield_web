                traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                timestamp: '2026-11-06T14:00:00+08:00'
        '500':
          description: 服务器内部错误
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: 服务器内部错误
                status: 500
                detail: 服务器内部错误
                code: INTERNAL_ERROR
                traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                timestamp: '2026-11-06T14:00:00+08:00'
      parameters:
      - name: page
        in: query
        required: false
        description: 页码
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        required: false
        description: 每页数量
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
      - name: keyword
        in: query
        required: false
        description: 嘉宾姓名或机构关键词
        schema:
          type: string
      - name: eventId
        in: query
        required: false
        description: 筛选参与指定场次的嘉宾
        schema:
          type: string
      security: []
  /public/speakers/{speakerId}:
    get:
      summary: 获取嘉宾详情
      operationId: getPublicSpeaker
      tags:
      - 大会门户
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponseBase'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      $ref: '#/components/schemas/SpeakerDetail'
        '404':
          description: 目标资源不存在
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: 未找到
                status: 404
                detail: 目标资源不存在
                code: RESOURCE_NOT_FOUND
                traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                timestamp: '2026-11-06T14:00:00+08:00'
        '500':
          description: 服务器内部错误
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: 服务器内部错误
                status: 500
                detail: 服务器内部错误
                code: INTERNAL_ERROR
                traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                timestamp: '2026-11-06T14:00:00+08:00'
      parameters:
      - name: speakerId
        in: path
        required: true
        description: 嘉宾 ID
        schema:
          type: string
      security: []
  /public/venues:
    get:
      summary: 查询会场列表
      operationId: listPublicVenues
      tags:
      - 大会门户
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
