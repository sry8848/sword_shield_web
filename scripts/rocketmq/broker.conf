brokerClusterName=DefaultCluster
brokerName=broker-a
brokerId=0
deleteWhen=04
fileReservedTime=48
brokerRole=ASYNC_MASTER
flushDiskType=ASYNC_FLUSH

# Store under the mounted volume (see docker-compose.yml: /home/rocketmq/store)
storePathRootDir=/home/rocketmq/store

# Important for local dev where apps run on host and RocketMQ runs in Docker:
# broker registers this address to NameServer; host-side clients will connect via the published ports.
brokerIP1=__BROKER_IP1__

# RocketMQ refuses send when storePathRootDir filesystem usage exceeds this ratio.
# The default is 75 (%). For local dev machines with limited free disk, you can raise it.
diskMaxUsedSpaceRatio=__DISK_MAX_USED_SPACE_RATIO__
diskSpaceWarningLevelRatio=__DISK_SPACE_WARNING_LEVEL_RATIO__
diskSpaceCleanForciblyRatio=__DISK_SPACE_CLEAN_FORCIBLY_RATIO__

autoCreateTopicEnable=true
autoCreateSubscriptionGroup=true
